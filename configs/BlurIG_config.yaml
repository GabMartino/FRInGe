# BlurIG_config.yaml
# Benchmark config for Blur Integrated Gradients

# -----------------------------
# MODELS
# -----------------------------
avail_models: ["resnet18", "resnet50", "resnet101", "resnet152", "inception_v3", "vgg19"]

# -----------------------------
# DATA / I-O
# -----------------------------
examples_dir: "./data/ImageNet"
results_root: "./results/methods/BlurIG"

# -----------------------------
# RUN PARAMS
# -----------------------------
batch_size: 4
seed: 42

# -----------------------------
# ATTRIBUTION SAVING
# -----------------------------
save_attributions: true
attr_save_dtype: "float16"

# -----------------------------
# BLUR IG HYPERPARAMS
# -----------------------------
max_sigma: 10.0         # Max blur radius (Start of path)
n_steps: 100            # Number of steps from max_sigma to 0

# Number of path steps evaluated per forward/backward call. Path gradients
# are batched across steps (like Captum's internal_batch_size for IG)
# instead of one sequential call per step; raise this while it still fits in
# GPU memory (upper bound n_steps * batch_size).
internal_batch_size: 32

# -----------------------------
# INSERTION / DELETION (Causal)
# -----------------------------
causal_baselines: ["blur", "black", "white"]
causal_steps: 100
causal_chunk_size: 4
causal_normalize: true

# -----------------------------
# MAS (Meta-Agnostic Slope)
# -----------------------------
mas_baselines: ["blur"]
mas_step_size: 224
mas_klen: 15
mas_nsig: 3.0
mas_batch_size: 32

# -----------------------------
# INFIDELITY
# -----------------------------
infide_n_perturbations: 50
noise_scale: 0.02
infidelity_chunk_size: 10